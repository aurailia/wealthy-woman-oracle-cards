<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wealth Frequency Oracle | Embody Wealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2E2340;
  --plum-soft:#57496B;
  --purple:#5B2A86;
  --violet:#7B3FA0;
  --lilac:#B79CD9;
  --lilac-mist:#E7DBF5;
  --lilac-veil:#F3ECFB;
  --white-soft:#FBF9FE;
  --gold:#C9A227;
  --gold-deep:#8A6A0C;
  --pink:#E84F8A;
  --pink-deep:#B32A68;
  --pink-soft:#F6C2D8;
  --grad:linear-gradient(120deg,#6A3494 0%,#9147AE 30%,#C55BA6 66%,#E86FA0 100%);
  --grad-title:linear-gradient(112deg,#5B2A86 0%,#8A45A6 32%,#C0509D 66%,#E2609B 100%);
  --grad-warm:linear-gradient(120deg,#D6438D 0%,#BE5DBE 50%,#9A76D2 100%);
  --grad-btn:linear-gradient(118deg,#D6438D 0%,#BE5DBE 52%,#9A76D2 100%);
  --grad-soft:linear-gradient(135deg,#F3ECFB 0%,#FFFFFF 48%,#FBE8F1 100%);
  --rail:262px;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  font-family:'Inter',system-ui,sans-serif;
  color:var(--plum);
  background:var(--lilac-veil);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.bg-layer{position:fixed;inset:0;background-image:var(--bg-url);background-size:cover;background-position:center;z-index:0;}
.bg-wash{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(30,20,44,.58) 0%,rgba(30,20,44,.46) 45%,rgba(30,20,44,.62) 100%);}

.shell{
  position:relative;z-index:2;display:flex;min-height:100vh;
  max-width:1340px;margin:0 auto;
  background:#EDE2F7;
  box-shadow:0 0 110px rgba(20,12,30,.55);
}

/* ---------- left rail ---------- */
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:linear-gradient(168deg,#2A1F3C 0%,#3D2557 52%,#4E2C68 100%);
  border-right:1px solid rgba(255,255,255,.09);
  padding:34px 0 44px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.rail-mark{padding:0 26px 28px;}
.rail-glyph{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#E2B6E8;opacity:.9;margin-bottom:10px;}
.rail-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1.12;
  background:linear-gradient(112deg,#FBEFFF 0%,#F0B9DA 48%,#CDA7EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.rail-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:rgba(255,255,255,.62);margin-top:8px;}

.rail-nav{display:flex;flex-direction:column;gap:2px;padding:0 14px;}
.tab{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;
  cursor:pointer;padding:13px 14px;border-radius:8px;font-family:'Inter',sans-serif;font-size:15px;
  font-weight:500;color:rgba(255,255,255,.7);transition:background .25s ease,color .25s ease;position:relative;
}
.tab:hover:not(.locked){background:rgba(255,255,255,.1);color:#fff;}
.tab:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
.tab.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600;}
.tab.active::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,#F0A9C8,#C9A6E8);
}
.tab.locked{opacity:.3;}
.tab.locked{opacity:.38;cursor:not-allowed;}
.tab-num{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.06em;width:20px;flex:0 0 20px;opacity:.8;}
.tab-label{flex:1;}
.tab-lock{font-size:10px;opacity:.7;}

/* rail cards */
.tab[data-tab="howto"]{margin-top:14px;}
.rail-nav{position:relative;}
.use-list{list-style:none;margin:0;padding:0;}
.use-list li{
  position:relative;padding-left:26px;margin-bottom:14px;
  font-size:16.5px;line-height:1.72;color:var(--plum);
}
.use-list li:last-child{margin-bottom:0;}
.use-list li::before{
  content:'';position:absolute;left:2px;top:11px;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-deep),var(--violet));
}
.use-note{
  margin-top:20px;padding-top:18px;border-top:1px solid rgba(91,42,134,.14);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.6;color:var(--plum-soft);
}
.join-box{
  border-radius:16px;padding:44px 40px;margin:34px 0 22px;background:var(--grad);color:#fff;
  box-shadow:0 20px 46px rgba(91,42,134,.32);
}
.join-box .panel-label{color:#FFE0EE;}
.join-title{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;line-height:1.14;margin-bottom:20px;}
.join-title em{font-style:italic;color:#FFE0A8;}
.join-box p{font-size:17.5px;line-height:1.8;margin-bottom:16px;color:rgba(255,255,255,.96);}
.join-box .use-list li{color:rgba(255,255,255,.96);}
.join-box .use-list li::before{background:#FFE0A8;}
.join-btn{
  display:inline-block;margin-top:12px;text-decoration:none;
  font-family:'Cinzel',serif;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  padding:16px 32px;border-radius:8px;background:#fff;color:var(--purple);
  box-shadow:0 10px 26px rgba(0,0,0,.22);transition:transform .25s ease;
}
.join-btn:hover{transform:translateY(-2px);}
.sign-off{
  margin-top:34px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;
  line-height:1.65;color:var(--purple);
}
.rail-cards{padding:26px 22px 0;margin-top:26px;border-top:1px solid rgba(255,255,255,.13);}
.rail-cards-label{font-family:'Cinzel',serif;font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#E2B6E8;margin-bottom:14px;}
.rail-card{margin-bottom:16px;}
.rail-card-pos{font-family:'Cinzel',serif;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#F5A8C9;margin-bottom:7px;}
.rail-card-img{border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.22);}
.rail-card-img img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;}
.rail-card-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin-top:9px;line-height:1.22;
  background:linear-gradient(112deg,#FBEFFF 0%,#F3BCDA 55%,#CFA9EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.rail-restart{margin-top:6px;}

/* ---------- stage ---------- */
.stage{flex:1;min-width:0;padding:56px 44px 90px;background:linear-gradient(180deg,#F2E9FA 0%,#EADDF6 58%,#F0E2F2 100%);}
.view{display:none;max-width:900px;margin:0 auto;}
.view.active{display:block;animation:riseIn .5s ease both;}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ---------- type ---------- */
.eyebrow{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--purple);font-weight:600;margin-bottom:18px;}
.display{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,5vw,52px);font-weight:600;line-height:1.12;letter-spacing:-.01em;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.display em{font-style:italic;font-weight:500;}
.lede{font-family:'Cormorant Garamond',serif;font-size:21.5px;line-height:1.6;color:var(--plum-soft);margin-top:18px;max-width:640px;}
.rule{height:2px;border:0;margin:34px 0;border-radius:2px;background:linear-gradient(90deg,#7B3FA0 0%,#E84F8A 46%,rgba(232,79,138,0) 100%);opacity:.5;}

/* ---------- steps ---------- */
.step{margin-top:34px;}
.step-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.step-num{font-family:'Cinzel',serif;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);}
.step-title{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:600;line-height:1.15;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.step.muted{opacity:.5;pointer-events:none;}

/* spread chooser */
.spread-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px;}
.spread-opt{
  background:#FFFFFF;border:1.5px solid rgba(91,42,134,.2);border-radius:14px;
  padding:26px 24px;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;
  transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease,background .3s ease;
  box-shadow:0 12px 32px rgba(46,25,70,.12);
}
.spread-opt:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(91,42,134,.14);border-color:rgba(123,63,160,.4);}
.spread-opt:focus-visible{outline:2px solid var(--violet);outline-offset:3px;}
.spread-opt.chosen{background:var(--grad-btn);border-color:transparent;box-shadow:0 14px 34px rgba(179,60,140,.3);}
.spread-opt.chosen .spread-count,.spread-opt.chosen .spread-desc,.spread-opt.chosen .spread-pos{color:#fff;}
.spread-opt.chosen .spread-name{background:none;-webkit-text-fill-color:#fff;color:#fff;}
.spread-opt.chosen .spread-name,.spread-opt.chosen .spread-name *{-webkit-text-fill-color:#fff;}
.spread-opt.chosen .spread-count{color:#FFE9A8;}
.spread-count{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:11px;}
.spread-name{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:600;margin-bottom:10px;line-height:1.15;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.spread-desc{font-size:15.5px;line-height:1.65;color:var(--plum-soft);}
.spread-pos{font-size:14.5px;line-height:1.8;color:var(--plum-soft);margin-top:13px;padding-top:13px;border-top:1px solid rgba(123,63,160,.14);}
.spread-opt.chosen .spread-pos{border-top-color:rgba(255,255,255,.28);}

/* breath */
.breath-wrap{text-align:center;padding:20px 0 6px;}
.breath-prompt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21.5px;line-height:1.6;color:var(--plum-soft);max-width:520px;margin:0 auto 38px;}
.breath-orb{
  width:180px;height:180px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,#FFFFFF 0%,#F6ECFC 55%,#FBE3F0 100%);
  border:1px solid rgba(123,63,160,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 0 0 12px rgba(183,156,217,.16),0 14px 40px rgba(91,42,134,.14);
}
.breath-orb:focus-visible{outline:2px solid var(--violet);outline-offset:6px;}
.breath-orb.inhale{animation:inhale 5s ease-in-out forwards;}
.breath-orb.exhale{animation:exhale 5s ease-in-out forwards;}
@keyframes inhale{from{transform:scale(1);box-shadow:0 0 0 12px rgba(183,156,217,.16),0 14px 40px rgba(91,42,134,.14);}
  to{transform:scale(1.26);box-shadow:0 0 0 26px rgba(183,156,217,.24),0 18px 52px rgba(91,42,134,.2);}}
@keyframes exhale{from{transform:scale(1.26);box-shadow:0 0 0 26px rgba(183,156,217,.24),0 18px 52px rgba(91,42,134,.2);}
  to{transform:scale(1);box-shadow:0 0 0 12px rgba(183,156,217,.16),0 14px 40px rgba(91,42,134,.14);}}
.breath-word{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;color:var(--purple);}
.skip-breath{
  display:inline-block;margin-top:18px;background:none;border:0;cursor:pointer;padding:8px 4px;
  font-family:'Inter',sans-serif;font-size:14.5px;color:var(--plum-soft);
  border-bottom:1px solid rgba(123,63,160,.36);transition:color .25s ease,border-color .25s ease;
}
.skip-breath:hover{color:#B8397A;border-bottom-color:#B8397A;}
.skip-breath:focus-visible{outline:2px solid var(--violet);outline-offset:3px;}
.breath-note{margin-top:26px;font-family:'Cinzel',serif;font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-deep);min-height:18px;}

/* fan */
.step-fan{margin-left:-30px;margin-right:-30px;}
@media (max-width:1180px){ .step-fan{margin-left:0;margin-right:0;} }
.fan-count{text-align:center;font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--purple);margin-bottom:12px;}
.pips{display:flex;justify-content:center;gap:8px;margin-bottom:24px;}
.pip{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pink-deep);transition:background .3s ease,box-shadow .3s ease;}
.pip.filled{background:var(--pink-deep);box-shadow:0 0 10px rgba(179,42,104,.5);}
.fan{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;max-width:960px;margin:0 auto;padding:14px 4px;}
.mini{
  width:108px;height:174px;border-radius:10px;border:0;padding:0;cursor:pointer;overflow:visible;position:relative;z-index:1;
  background:var(--grad);box-shadow:0 5px 14px rgba(91,42,134,.2);
  transition:transform .38s cubic-bezier(.4,0,.2,1),box-shadow .38s ease,opacity .38s ease;
  animation:dealIn .5s ease both;
}
.mini img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px;}
.mini:hover{transform:translateY(-14px) scale(1.06);box-shadow:0 20px 36px rgba(91,42,134,.34);}
.mini:focus-visible{outline:2px solid var(--purple);outline-offset:3px;}
.mini.selected{
  z-index:8;cursor:default;
  animation:popSelect .55s cubic-bezier(.34,1.4,.64,1) forwards;
  box-shadow:
    0 26px 46px rgba(91,42,134,.46),
    0 0 0 3px var(--gold),
    0 0 30px 6px rgba(232,79,138,.45);
}
.mini.selected img{border-radius:8px;}
.mini.dimmed{opacity:.2;pointer-events:none;transform:scale(.94);filter:saturate(.4);}
@keyframes popSelect{
  0%{transform:translateY(0) scale(1);}
  55%{transform:translateY(-32px) scale(1.28);}
  100%{transform:translateY(-24px) scale(1.2);}
}
.mini-badge{
  position:absolute;top:-13px;right:-13px;width:34px;height:34px;border-radius:50%;
  background:var(--grad-warm);color:#fff;font-family:'Cinzel',serif;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;line-height:1;
  border:2px solid #fff;box-shadow:0 5px 14px rgba(179,42,104,.55);
  animation:badgePop .35s ease .22s both;
}
@keyframes badgePop{from{opacity:0;transform:scale(.3);}to{opacity:1;transform:scale(1);}}
@keyframes dealIn{from{opacity:0;transform:translateY(18px) rotate(-3deg);}to{opacity:1;transform:none;}}

/* ---------- panels ---------- */
.panel{background:#FFFFFF;border:1px solid rgba(91,42,134,.16);border-radius:14px;padding:34px 36px;margin-bottom:22px;box-shadow:0 14px 38px rgba(46,25,70,.13);}
.panel-label{font-family:'Cinzel',serif;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);font-weight:600;margin-bottom:20px;}
.body-text p{font-size:17px;line-height:1.82;color:var(--plum);margin-bottom:16px;}
.body-text p:last-child{margin-bottom:0;}

/* card display */
.card-hero{width:100%;max-width:320px;margin:0 auto 32px;border-radius:16px;overflow:hidden;
  box-shadow:0 22px 50px rgba(91,42,134,.26);border:1px solid rgba(255,255,255,.7);animation:riseIn .6s ease both;}
.card-hero img{width:100%;display:block;}
.card-title{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,4.8vw,48px);font-weight:600;line-height:1.1;text-align:center;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.card-tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;text-align:center;color:var(--plum-soft);margin-top:10px;margin-bottom:32px;}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:56px 0 36px;}
.trio-item{text-align:center;animation:riseIn .6s ease both;}
.trio-item:nth-child(2){animation-delay:.12s;}
.trio-item:nth-child(3){animation-delay:.24s;}
.trio-pos{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:14px;min-height:34px;}
.trio-img{border-radius:12px;overflow:hidden;box-shadow:0 14px 34px rgba(91,42,134,.22);border:1px solid rgba(255,255,255,.7);}
.trio-img img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;}
.trio-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-top:14px;line-height:1.2;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.trio-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16.5px;color:var(--plum-soft);margin-top:6px;line-height:1.45;}

/* together */
.together{border-radius:16px;padding:44px 40px;margin:36px 0 20px;background:var(--grad);color:#fff;box-shadow:0 20px 46px rgba(91,42,134,.28);}
.together .panel-label{color:#FFE0EE;}
.together-title{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;line-height:1.14;margin-bottom:24px;}
.together-title em{font-style:italic;color:#F0DFA8;}
.together p{font-size:17.5px;line-height:1.8;margin-bottom:16px;color:rgba(255,255,255,.96);}
.together strong{color:#F0DFA8;font-weight:500;}
.together-close{margin-top:24px;padding-top:24px;border-top:1px solid rgba(255,255,255,.26);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.65;}

/* inner tabs */
.inner-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid rgba(123,63,160,.14);}
.inner-tab{
  border:1px solid rgba(91,42,134,.24);background:#FFFFFF;border-radius:9px;cursor:pointer;
  padding:11px 16px;text-align:left;font-family:'Inter',sans-serif;transition:background .25s ease,border-color .25s ease,transform .25s ease;
}
.inner-tab:hover{transform:translateY(-2px);border-color:rgba(123,63,160,.44);}
.inner-tab:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
.inner-tab.active{background:var(--grad-btn);border-color:transparent;box-shadow:0 8px 20px rgba(179,60,140,.28);}
.inner-tab-pos{font-family:'Cinzel',serif;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px;}
.inner-tab-name{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--purple);line-height:1.15;}
.inner-tab.active .inner-tab-name{color:#fff;}
.inner-tab.active .inner-tab-pos{color:#FFE9A8;}

.inner-head{margin-bottom:22px;}
.inner-head-pos{font-family:'Cinzel',serif;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:12px;}
.inner-head-name{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;line-height:1.12;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.inner-head-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--plum-soft);margin-top:8px;}

/* practice */
.panel.in-short{background:linear-gradient(135deg,#F6EFFD 0%,#FFFFFF 62%,#FCEFF6 100%);border-color:rgba(91,42,134,.26);}
.panel.in-short .body-text p{font-size:18.5px;line-height:1.78;font-family:'Cormorant Garamond',serif;}
.panel.practice{background:linear-gradient(135deg,#F7F0FD 0%,#FFFFFF 52%,#FCEBF3 100%);
  border-color:rgba(179,42,104,.28);border-left:4px solid var(--pink-deep);}
.practice-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;margin-bottom:14px;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.practice-pending{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--plum-soft);}

  "meaning": "Scarcity trains you to ask for exactly enough, to size every desire to bare survival, to feel safest with just barely sufficient. 😬\n\nWealth runs on an entirely different setting. 🌊 It expects overflow, the surplus, the more-than-needed, the abundance that spills past your own bills 💸 and lets you give freely, rest without guilt, and say yes without first consulting the balance like it's your stern accountant. 🤓\n\nOverflow isn't greedy. It's the natural state of a life that quit operating from lack. 🙌 It's what makes generosity feel easy instead of terrifying. 💛",
  "why": "You pulled this because you've been calibrating your whole vision to survival, asking for just enough to cover the bills and not drown. 🆘\n\nStability's great, but you've mistaken it for the ceiling when it's barely the floor. 📏 Today, let yourself picture the version where there's genuinely more than enough, where money's a source of ease and choice and yes instead of a low hum of dread.\n\nThat overflow frequency is the one that lets you give from a full cup instead of a leaking one. 🥤 Aim higher than survival. You're allowed, I promise. 💫",
  "summary": "You've been asking for exactly enough and mistaking survival for the ceiling. Wealth runs on surplus, the kind that lets you give and rest without checking the balance first. Aim higher than getting by. 🌊",
  "closing": "Look at your pricing and ask honestly whether it's built for survival or for surplus. Most soul-led businesses are priced for exactly enough, which is why there's never a cushion. Rework one offer this week so it's priced with room in it. Room to pay yourself properly, invest, rest and give.",
  "practiceTitle": "Room In The Picture",
  "practiceText": "Picture the number you've been asking for. Whatever it is, you'll have set it at survival plus a little. 🌊\n\nNow picture the version with real room in it. Enough for the bills, plus the thing you keep deferring, plus giving without checking the balance first, plus a cushion you never touch.\n\nWatch what your body does. Tightness, guilt, a fast urge to be reasonable about it. Breathe there until it settles, then write the bigger number down and make that the one you're actually asking for.",
  "blockLine": "asking for exactly enough and calling that being sensible",
  "callLine": "a life with room in it, past the bills and past the bracing",
  "moveLine": "writing down the bigger number and making that the one you ask for"
 },

  "desc": "The woman you're becoming isn't in next year.",
  "meaning": "You keep talking about your future self like she's got an apartment in some better year 🏙️, available right after the income hits or the business calms down or you finally feel ready. 👑\n\nShe's not a destination, though. She's a frequency, and she's here now, in this very ordinary moment, in the next small choice you make. She's the one deciding whether to meet today with dread or with expectation. ✨\n\nThe woman with the thriving business doesn't think differently because she got the result. She got the result because she decided to be her first. 💅",
  "why": "You pulled this because you keep filing her under later 🗂️, telling yourself you'll get to be her once you've earned it, once the proof's in, once it's safe.\n\nThat's backwards, and frankly some part of you is exhausted from waiting for permission to be who you already are. 😮‍💨 Quit saving her for a special occasion. Make one decision today the way she would, how she'd speak, what she'd charge 💰, what she'd flat-out refuse to tolerate.\n\nShe's not ahead of you on the road. She's standing right where you are, tapping her foot 👠, waiting for you to let her drive. 🚗",
  "summary": "You keep filing the woman you're becoming under next year. She's a frequency, and she's available in the very next decision you make. Make one today the way she'd make it. 👠",
  "closing": "The woman running the business you want makes different decisions, and she makes them today. This week, take your three biggest business decisions and make each one as her. What she charges, who she says no to, what she stops explaining. Wealth arrives at the frequency of the decisions rather than on the calendar.",

  "practiceText": "Pick one thing off today's list. Just one. 👠\n\nNow make it the way she'd make it, the woman with the business already thriving. What she'd charge for it. How she'd word the message. What she'd decline without writing a paragraph of explanation first.\n\nDon't upgrade your whole life today. Make one decision at her frequency and let your body catch up to it. She's not waiting for you to be ready. She's waiting for you to move once.",

  "desc": "Something small already came. Count it.",
  "meaning": "Abundance almost never arrives as the big, cinematic moment you've been scanning the horizon for. 🎬🔭\n\nIt comes quietly first, in forms easy to miss when your eyes are locked on the dramatic version, a refund, an unexpected gift 🎁, a sale you didn't chase, a kindness, a small surprise yes. These aren't runner-up prizes. They're seeds. 🌱\n\nThe giant harvest you want 🌾 is built entirely out of the small things you keep waving off because they didn't show up in the size or shape you demanded.",
  "why": "You pulled this because you've been so fixated on what hasn't arrived that you've gone face-blind to what has. 🙈\n\nThere have been small abundances lately. ✨ You breezed right past them, too busy lacking the big thing to clock the little ones landing in your hands. 🤲 This is your recognition card.\n\nLook back over the last week and actually count what came, no matter how unimpressive. 🔢 Name it. Let it land. Gratitude isn't decorative here, it's the literal mechanism that tells the universe to send more of what you're finally willing to notice. 🌟",

  "desc": "You don't need to see the whole staircase.",
  "meaning": "You've been trying to micromanage the exact route the money takes to reach you 🗺️, casting the source, the timing, the method, as if the whole manifestation hinges on you solving the logistics personally. 🗝️\n\nIt doesn't, and that grip is actually pinching shut the channels it could arrive through. 🤏 Your job is to hold the vision clearly and feel it as real.\n\nThe how is genuinely not your department. 🙅‍♀️ It's handled by something with a much wider view than your planning brain 🧠, and it almost always shows up by a route you'd never have guessed in a thousand years. ✨",
  "why": "You pulled this because you've been gripping a plan, convinced that if you can't see precisely how it'll happen, it won't. 📋😬\n\nThat need to control the how is just fear in a sensible blazer. 🧥😏 Loosen it today. Get crystal clear on what you want and how it feels to have it, then deliberately drop the demand to know the path.\n\nStay open to the random check 💵, the out-of-nowhere message 📩, the door you didn't know existed. 🚪 The surprise route is usually the better one, but you have to stop blocking it with your insistence on the one you sketched out. ✏️",
  "summary": "You've been trying to project-manage the route the money takes to reach you, and the grip is closing the very channels it could arrive through. Hold the vision, feel it real, drop the how. It usually comes by a road you'd never have picked. 🗺️",
  "closing": "You've decided how the money is supposed to arrive and the plan has become the bottleneck. Keep the revenue goal and drop the route. This week, say yes to one opportunity that doesn't fit the plan. The collaboration, the speaking slot, the different kind of client. Money usually comes through the door you weren't watching.",
  "practiceTitle": "Drop The Route",
  "practiceText": "Write down what you want and how it'll feel to have it. Be specific about the feeling. 🗺️\n\nUnderneath, write out the route you've been insisting on. The source, the timing, the exact way it has to arrive. Look at it properly.\n\nThen strike the whole route through. Physically cross it out. Write: this or something better, by any road. Stay awake today for the message, the offer, the door you didn't sketch, because that's usually the one it comes through.",

  "desc": "Raise it. Say the number. Don't flinch.",
  "meaning": "This is your own-value card, and the slightly uncomfortable truth in it is that you've been pricing yourself for the other person's comfort instead of for the reality of what you bring. 💎\n\nThe flinch you feel when you imagine saying the higher number 😬 isn't proof the number's wrong. It's the old story, the one insisting you have to be small and affordable to get chosen, leaving your body on its way out. 👋\n\nYour worth was never up for debate. Your willingness to say it out loud, without immediately discounting it 🏷️🚫, is the only thing that's been missing. 💅",

  "meaning": "You've been grading your worth on how long it's taking, treating the wait as proof something's wrong with you or your path. ⏰😣\n\nBut the timeline you imagined was never a contract. 📄🚫 It was a guess, made by an earlier, more anxious version of you, and the universe never signed it.\n\nWhat's yours isn't late. It's moving toward you at exactly the pace that lets you actually hold it when it lands, and the gap between now and then is doing necessary work you'll only appreciate in the rearview mirror. 🚗🪞",

  "desc": "You don't have to earn rest or wealth.",
  "meaning": "Somewhere early you got handed the rule that good things must be paid for in exhaustion 😮‍💨, that worthiness is earned through depletion, that rest and money and ease have to be deserved before they're allowed through the door. 🤍\n\nSo you keep proving, performing, over-delivering, staying late ⏰, doing more than anyone asked. But worthiness was never the entry fee 🎟️, and the proving has quietly become its own little prison. 🔒\n\nYou're allowed to stop auditioning for a life that's already yours by birthright. 👑",

  "why": "You pulled this because you showed up a little dimmed 🔅, quietly wondering if you've still got it, if the thing you once felt so sure about is still alive in there somewhere.\n\nIt is. 🔥 This card is the ember glowing in the dark, proof the fire's still on. Do one small thing today that reminds you why you started, revisit the original vision, the first reason, the moment you just knew. 💡\n\nDon't wait to feel inspired before you tend it. Tend it, and the inspiration comes roaring back like it never left. 🌟",

  "desc": "It's drawn to a woman who expects it.",
  "meaning": "Money isn't running from you, and it isn't out to punish you. 💰\n\nIt behaves a lot like an animal 🐈, drawn to calm, to clarity, to expectation, and spooked by desperation, apology, and chaos. The way you hold money in your head is pretty much the way it behaves in your life. 🧠\n\nA woman who expects money, who talks about it with ease and welcome instead of dread and lack, becomes a place money actually wants to hang around. 🏡 This isn't magical thinking. It's frequency, and frequency is one of the few things you can genuinely change today. ✨",

  "title": "The Honest No",

  ["start",    "I",   "Start Here"],
  ["cards",    "II",  "Your Cards"],
  ["meaning",  "III", "The Meaning"],
  ["practice", "IV",  "The Practice"],
  ["howto",    "\u2726", "How To Use This"]
];

var state = {
  tab: "start",
  mode: null,        // 'single' | 'three'
  step: "spread",    // 'spread' | 'breath' | 'fan'
  picked: [],
  busy: false,
  meaningIdx: 0,
  practiceIdx: 0
};

/* ---------- helpers ---------- */
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined && txt !== null) n.textContent = txt;
  return n;
}
function paras(cls, text){
  var box = el("div", cls);
  String(text || "").split(/\n\n+/).forEach(function(chunk){
    var t = chunk.trim();
    if (t) box.appendChild(el("p", null, t));
  });
  return box;
}
function firstPara(text){
  var parts = String(text || "").split(/\n\n+/);
  return parts.length ? parts[0].trim() : "";
}
function cardImg(card){
  var img = document.createElement("img");
  img.src = CARD_IMG_BASE + card.slug + ".png";
  img.alt = card.title;
  img.loading = "lazy";
  return img;
}
function chosenCards(){
  return state.picked.map(function(i){ return DECK[i]; });
}
function hasReading(){ return state.picked.length > 0; }

/* ---------- rail ---------- */
function buildRail(){
  var nav = document.getElementById("railNav");
  nav.innerHTML = "";
  TABS.forEach(function(t){
    var b = el("button", "tab");
    b.type = "button";
    b.dataset.tab = t[0];
    b.appendChild(el("span", "tab-num", t[1]));
    b.appendChild(el("span", "tab-label", t[2]));
    b.addEventListener("click", function(){
      if (b.classList.contains("locked")) return;
      goTab(t[0]);
    });
    nav.appendChild(b);
  });
  syncRail();
}

function syncRail(){
  var open = hasReading();
  document.querySelectorAll(".tab").forEach(function(b){
    var name = b.dataset.tab;
    b.classList.toggle("active", name === state.tab);
    var locked = (name !== "start" && name !== "howto") && !open;
    b.classList.toggle("locked", locked);
    b.setAttribute("aria-disabled", locked ? "true" : "false");
  });
  renderRailCards();
}

function renderRailCards(){
  var host = document.getElementById("railCards");
  host.innerHTML = "";
  if (!hasReading()) return;

  var all = chosenCards();
  var shown = all.map(function(card, i){ return { card: card, pos: i }; });
  var label = state.mode === "three" ? "Your three cards" : "Your card";

  // On the meaning and practice tabs, follow whichever inner tab is open
  if (state.mode === "three"){
    if (state.tab === "meaning"){
      shown = [{ card: all[state.meaningIdx], pos: state.meaningIdx }];
      label = "Reading now";
    } else if (state.tab === "practice"){
      shown = [{ card: all[state.practiceIdx], pos: state.practiceIdx }];
      label = "Practising now";
    }
  }

  var wrap = el("div", "rail-cards");
  wrap.appendChild(el("div", "rail-cards-label", label));

  shown.forEach(function(entry){
    var box = el("div", "rail-card");
    if (state.mode === "three") box.appendChild(el("div", "rail-card-pos", POSITIONS[entry.pos]));
    var frame = el("div", "rail-card-img");
    frame.appendChild(cardImg(entry.card));
    box.appendChild(frame);
    box.appendChild(el("div", "rail-card-name", entry.card.title));
    wrap.appendChild(box);
  });

  var restart = el("button", "btn tiny rail-restart", "New Reading");
  restart.type = "button";
  restart.addEventListener("click", resetAll);
  wrap.appendChild(restart);

  host.appendChild(wrap);
}

function goTab(name){
  state.tab = name;
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  var view = document.getElementById("view-" + name);
  if (view) view.classList.add("active");

  if (name === "start")    renderStart();
  if (name === "cards")    renderCards();
  if (name === "meaning")  renderMeaning();
  if (name === "practice") renderPractice();
  if (name === "howto")    renderHowTo();

  syncRail();
  window.scrollTo({ top:0, behavior:"smooth" });
}

function resetAll(){
  state.mode = null;
  state.step = "spread";
  state.picked = [];
  state.busy = false;
  state.meaningIdx = 0;
  state.practiceIdx = 0;
  goTab("start");
}

/* ============================================================
   TAB I — START HERE : spread, breath, fan
   ============================================================ */
function renderStart(){
  var host = document.getElementById("view-start");
  host.innerHTML = "";

  host.appendChild(el("div", "eyebrow", "Start Here"));
  var h = el("h1", "display");
  h.appendChild(document.createTextNode("Ask the question you're "));
  h.appendChild(el("em", null, "actually"));
  h.appendChild(document.createTextNode(" asking."));
  host.appendChild(h);
  host.appendChild(el("p", "lede", "Something specific beats something noble. Why won't this offer sell will get you further than what do I need to know."));
  host.appendChild(el("hr", "rule"));

  host.appendChild(buildSpreadStep());
  host.appendChild(buildBreathStep());
  host.appendChild(buildFanStep());
}

function stepShell(num, title, muted){
  var s = el("div", "step" + (muted ? " muted" : ""));
  var head = el("div", "step-head");
  head.appendChild(el("div", "step-num", num));
  head.appendChild(el("div", "step-title", title));
  s.appendChild(head);
  return s;
}

function buildSpreadStep(){
  var s = stepShell("Step One", "Choose your spread", false);
  var grid = el("div", "spread-grid");

  var opts = [
    ["single", "One Card", "Daily Read", "A single straight answer for where you are right now.", ""],
    ["three",  "Three Cards", "The Path Forward", "Three cards read as one message.",
     "1. What's Blocking You\n2. What's Calling You\n3. Your Next Aligned Move"]
  ];

  opts.forEach(function(o){
    var b = el("button", "spread-opt" + (state.mode === o[0] ? " chosen" : ""));
    b.type = "button";
    b.appendChild(el("div", "spread-count", o[1]));
    b.appendChild(el("div", "spread-name", o[2]));
    b.appendChild(el("div", "spread-desc", o[3]));
    if (o[4]){
      var pos = el("div", "spread-pos");
      o[4].split("\n").forEach(function(line, i){
        if (i) pos.appendChild(document.createElement("br"));
        pos.appendChild(document.createTextNode(line));
      });
      b.appendChild(pos);
    }
    b.addEventListener("click", function(){
      state.mode = o[0];
      state.step = "breath";
      state.picked = [];
      state.busy = false;
      renderStart();
      var target = document.getElementById("stepBreath");
      if (target) target.scrollIntoView({ behavior:"smooth", block:"center" });
    });
    grid.appendChild(b);
  });

  s.appendChild(grid);
  return s;
}

function buildBreathStep(){
  var ready = state.mode !== null;
  var s = stepShell("Step Two", "Take one breath", !ready);
  s.id = "stepBreath";

  var wrap = el("div", "breath-wrap");
  wrap.appendChild(el("p", "breath-prompt", "Hand on your heart. Let the question you actually came with rise up, the specific one, not the polite one."));

  var orb = el("div", "breath-orb");
  orb.setAttribute("role", "button");
  orb.setAttribute("tabindex", ready ? "0" : "-1");
  orb.setAttribute("aria-label", "Begin the breath");
  var word = el("div", "breath-word", state.step === "fan" ? "Tuned in" : "Begin");
  orb.appendChild(word);

  var note = el("div", "breath-note", state.step === "fan" ? "" : "Tap when you're ready");

  function begin(){
    if (state.busy || !ready || state.step === "fan") return;
    state.busy = true;
    word.textContent = "Breathe in";
    note.textContent = "";
    orb.classList.add("inhale");
    setTimeout(function(){
      word.textContent = "Breathe out";
      orb.classList.remove("inhale");
      orb.classList.add("exhale");
      setTimeout(function(){
        orb.classList.remove("exhale");
        word.textContent = "Tuned in";
        note.textContent = "Letting the cards rise";
        setTimeout(function(){
          state.step = "fan";
          state.busy = false;
          renderStart();
          var f = document.getElementById("stepFan");
          if (f) f.scrollIntoView({ behavior:"smooth", block:"start" });
        }, 1200);
      }, 5000);
    }, 5000);
  }

  orb.addEventListener("click", begin);
  orb.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); begin(); }
  });

  wrap.appendChild(orb);
  wrap.appendChild(note);

  if (ready && state.step !== "fan"){
    var skip = el("button", "skip-breath", "Skip the breath, go straight to the cards");
    skip.type = "button";
    skip.addEventListener("click", function(){
      if (state.busy) return;
      state.step = "fan";
      renderStart();
      var f = document.getElementById("stepFan");
      if (f) f.scrollIntoView({ behavior:"smooth", block:"start" });
    });
    wrap.appendChild(skip);
  }

  s.appendChild(wrap);
  return s;
}

function buildFanStep(){
  var ready = state.step === "fan";
  var need = state.mode === "three" ? 3 : 1;
  var s = stepShell("Step Three", need === 3 ? "Choose three cards" : "Choose one card", !ready);
  s.id = "stepFan";
  if (ready) s.className += " step-fan";

  if (!ready){
    s.appendChild(el("p", "lede", "The cards rise once you've taken your breath."));
    return s;
  }

  var counter = el("div", "fan-count", need === 3 ? "Select 3 cards" : "Select 1 card");
  s.appendChild(counter);

  var pips = el("div", "pips");
  s.appendChild(pips);
  function drawPips(){
    pips.innerHTML = "";
    for (var i = 0; i < need; i++){
      pips.appendChild(el("div", "pip" + (i < state.picked.length ? " filled" : "")));
    }
  }
  drawPips();

  var fan = el("div", "fan");
  var order = DECK.map(function(_, i){ return i; });
  for (var i = order.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }

  order.forEach(function(idx, n){
    var b = el("button", "mini");
    b.type = "button";
    b.setAttribute("aria-label", "Face down card " + (n + 1));
    b.style.animationDelay = (n * 20) + "ms";
    var img = document.createElement("img");
    img.src = CARD_BACK;
    img.alt = "";
    b.appendChild(img);

    b.addEventListener("click", function(){
      if (b.classList.contains("selected") || state.picked.length >= need) return;
      b.classList.add("selected");
      state.picked.push(idx);
      var badge = el("div", "mini-badge", need === 3 ? String(state.picked.length) : "\u2726");
      b.appendChild(badge);
      drawPips();
      counter.textContent = state.picked.length === need
        ? "Turning them over"
        : (need - state.picked.length) + " more to choose";
      if (state.picked.length === need){
        fan.querySelectorAll(".mini:not(.selected)").forEach(function(c){ c.classList.add("dimmed"); });
        setTimeout(function(){
          state.meaningIdx = 0;
          state.practiceIdx = 0;
          goTab("cards");
        }, 1000);
      }
    });
    fan.appendChild(b);
  });

  s.appendChild(fan);
  return s;
}

/* ============================================================
   TAB II — YOUR CARDS
   ============================================================ */
function renderCards(){
  var host = document.getElementById("view-cards");
  host.innerHTML = "";
  if (!hasReading()) return;

  var cards = chosenCards();

  if (state.mode === "three"){
    host.appendChild(el("div", "eyebrow", "Your Cards"));
    var h = el("h1", "display");
    h.appendChild(document.createTextNode("Three cards, "));
    h.appendChild(el("em", null, "one message"));
    h.appendChild(document.createTextNode("."));
    host.appendChild(h);

    var trio = el("div", "trio");
    cards.forEach(function(card, i){
      var item = el("div", "trio-item");
      item.appendChild(el("div", "trio-pos", POSITIONS[i]));
      var box = el("div", "trio-img");
      box.appendChild(cardImg(card));
      item.appendChild(box);
      item.appendChild(el("div", "trio-name", card.title));
      item.appendChild(el("div", "trio-tag", card.desc));
      trio.appendChild(item);
    });
    host.appendChild(trio);
    host.appendChild(buildTogether(cards));
  } else {
    var card = cards[0];
    host.appendChild(el("div", "eyebrow", "Your Card"));

    var hero = el("div", "card-hero");
    hero.appendChild(cardImg(card));
    host.appendChild(hero);

    host.appendChild(el("h1", "card-title", card.title));
    host.appendChild(el("p", "card-tagline", card.desc));

    var p = el("div", "panel in-short");
    p.appendChild(el("div", "panel-label", "In Short"));
    p.appendChild(paras("body-text", card.summary || firstPara(card.meaning)));
    host.appendChild(p);
  }

  var acts = el("div", "actions");
  var next = el("button", "btn primary", "Go Deeper");
  next.type = "button";
  next.addEventListener("click", function(){ goTab("meaning"); });
  acts.appendChild(next);

  var again = el("button", "btn", "New Reading");
  again.type = "button";
  again.addEventListener("click", resetAll);
  acts.appendChild(again);
  host.appendChild(acts);
}

function buildTogether(cards){
  var box = el("div", "together");
  box.appendChild(el("div", "panel-label", "\u2726 Bringing It All Together \u2726"));

  var t = el("h3", "together-title");
  t.appendChild(document.createTextNode("The block. The call. "));
  t.appendChild(el("em", null, "The move."));
  box.appendChild(t);

  var rows = [
    ["What's been blocking you is ", cards[0].blockLine, cards[0], "What's been blocking you: "],
    ["What's calling you is ",       cards[1].callLine,  cards[1], "What's calling you: "],
    ["Your next aligned move is ",   cards[2].moveLine,  cards[2], "Your next aligned move: "]
  ];

  rows.forEach(function(row){
    var p = document.createElement("p");
    if (row[1]){
      p.appendChild(document.createTextNode(row[0]));
      p.appendChild(el("strong", null, row[1]));
      p.appendChild(document.createTextNode("."));
    } else {
      p.appendChild(document.createTextNode(row[3]));
      p.appendChild(el("strong", null, row[2].title));
      p.appendChild(document.createTextNode(". " + row[2].desc));
    }
    box.appendChild(p);
  });

  box.appendChild(el("p", "together-close",
    "Three cards, one sentence. You already know which of the three you flinched at. That's the one to start with today."));
  return box;
}

/* ============================================================
   TAB III — THE MEANING
   ============================================================ */
function renderMeaning(){
  var host = document.getElementById("view-meaning");
  host.innerHTML = "";
  if (!hasReading()) return;

  var cards = chosenCards();
  host.appendChild(el("div", "eyebrow", "The Meaning"));

  var h = el("h1", "display");
  h.appendChild(document.createTextNode("What it means, "));
  h.appendChild(el("em", null, "and why it came"));
  h.appendChild(document.createTextNode("."));
  host.appendChild(h);
  host.appendChild(el("hr", "rule"));

  if (state.mode === "three"){
    host.appendChild(buildInnerTabs(cards, state.meaningIdx, function(i){
      state.meaningIdx = i;
      renderMeaning();
      renderRailCards();
    }));
    var idx = state.meaningIdx;
    host.appendChild(innerHead(cards[idx], idx));
    host.appendChild(meaningPanel(cards[idx]));
    host.appendChild(whyPanel(cards[idx]));
  } else {
    host.appendChild(meaningPanel(cards[0]));
    host.appendChild(whyPanel(cards[0]));
  }

  var acts = el("div", "actions");
  var next = el("button", "btn primary", "The Practice");
  next.type = "button";
  next.addEventListener("click", function(){ goTab("practice"); });
  acts.appendChild(next);
  host.appendChild(acts);
}

function buildInnerTabs(cards, activeIdx, onPick){
  var wrap = el("div", "inner-tabs");
  cards.forEach(function(card, i){
    var b = el("button", "inner-tab" + (i === activeIdx ? " active" : ""));
    b.type = "button";
    b.appendChild(el("div", "inner-tab-pos", POSITIONS[i]));
    b.appendChild(el("div", "inner-tab-name", card.title));
    b.addEventListener("click", function(){ onPick(i); });
    wrap.appendChild(b);
  });
  return wrap;
}

function innerHead(card, i){
  var head = el("div", "inner-head");
  head.appendChild(el("div", "inner-head-pos", POSITIONS[i]));
  head.appendChild(el("h2", "inner-head-name", card.title));
  head.appendChild(el("p", "inner-head-tag", card.desc));
  return head;
}

function meaningPanel(card){
  var p = el("div", "panel");
  p.appendChild(el("div", "panel-label", "The Meaning"));
  p.appendChild(paras("body-text", card.meaning));
  return p;
}
function whyPanel(card){
  var p = el("div", "panel");
  p.appendChild(el("div", "panel-label", "Why You Pulled This"));
  p.appendChild(paras("body-text", card.why));
  return p;
}

/* ============================================================
   TAB IV — THE PRACTICE
   ============================================================ */
function renderPractice(){
  var host = document.getElementById("view-practice");
  host.innerHTML = "";
  if (!hasReading()) return;

  var cards = chosenCards();
  host.appendChild(el("div", "eyebrow", "The Practice"));

  var h = el("h1", "display");
  h.appendChild(document.createTextNode("Do the thing, "));
  h.appendChild(el("em", null, "today"));
  h.appendChild(document.createTextNode("."));
  host.appendChild(h);
  host.appendChild(el("p", "lede", "The reading tells you where you are. This is the part that moves you."));
  host.appendChild(el("hr", "rule"));

  if (state.mode === "three"){
    host.appendChild(buildInnerTabs(cards, state.practiceIdx, function(i){
      state.practiceIdx = i;
      renderPractice();
      renderRailCards();
    }));
    var idx = state.practiceIdx;
    host.appendChild(innerHead(cards[idx], idx));
    host.appendChild(practicePanel(cards[idx]));
  } else {
    host.appendChild(practicePanel(cards[0]));
  }

  host.appendChild(closingCeremony(state.mode === "three" ? cards[state.practiceIdx] : cards[0]));

  var acts = el("div", "actions");
  var again = el("button", "btn primary", "New Reading");
  again.type = "button";
  again.addEventListener("click", resetAll);
  acts.appendChild(again);
  host.appendChild(acts);
}

function practicePanel(card){
  var p = el("div", "panel practice");
  p.appendChild(el("div", "panel-label", "The Practice"));
  if (card.practiceText){
    p.appendChild(el("h4", "practice-title", card.practiceTitle));
    p.appendChild(paras("body-text", card.practiceText));
  } else {
    p.appendChild(el("p", "practice-pending", "Practice still being written for this card."));
  }
  return p;
}

function closingCeremony(card){
  var box = el("div", "ceremony");
  box.appendChild(el("div", "panel-label", "Closing The Reading"));
  box.appendChild(el("h4", "practice-title", "Where This Goes In Your Business"));
  box.appendChild(paras("body-text", card.closing || card.desc));

  var foot = el("div", "ceremony-foot");
  foot.appendChild(el("div", "ceremony-foot-label", "Before you close the tab"));
  var fb = el("div", "body-text");
  fb.appendChild(el("p", null, "Hand on your heart. Say out loud what you're taking from this, in one plain sentence, then say thank you. Naming what you received is how you teach your body it's safe to receive again."));
  fb.appendChild(el("p", null, "If something in the reading stung, give it a minute before you go. Ho'oponopono is an old Hawaiian clearing practice and it's four short lines, said in order, to whatever's holding the ache."));
  fb.appendChild(el("p", null, "Bring the thing to mind first. The number, the memory, the client, the version of you who made that decision. Hand on your heart, and say the lines out loud."));
  foot.appendChild(fb);

  var lines = el("div", "hoop-lines");
  ["I'm sorry.", "Please forgive me.", "Thank you.", "I love you."].forEach(function(line){
    lines.appendChild(el("div", null, line));
  });
  foot.appendChild(lines);

  var fb2 = el("div", "body-text");
  fb2.appendChild(el("p", null, "Say the whole round three or four times, slowly. It's meant to feel a bit boring by the end. That's the thing settling."));
  fb2.appendChild(el("p", null, "The I'm sorry isn't you taking the blame for anything. You're speaking to the part of you that's been carrying this on her own. You don't have to feel any of it for it to work, so say the words and let your body catch up."));
  foot.appendChild(fb2);
  box.appendChild(foot);
  return box;
}

/* ============================================================
   HOW TO USE THIS
   ============================================================ */
function useList(items){
  var ul = el("ul", "use-list");
  items.forEach(function(t){ ul.appendChild(el("li", null, t)); });
  return ul;
}
function usePanel(label, items, note){
  var p = el("div", "panel");
  p.appendChild(el("div", "panel-label", label));
  p.appendChild(useList(items));
  if (note) p.appendChild(el("p", "use-note", note));
  return p;
}

/* ---------- boot ---------- */
buildRail();
goTab("start");
